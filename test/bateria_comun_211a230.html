    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "Según el análisis del contexto social del documento de Diagnóstico del Pacto Vasco de Salud de Euskadi, ¿qué factor se identifica como un motor clave para que la ciudadanía del siglo XXI demande un papel más activo en su salud? (211)",

  {

      "d) Permitir auditorías externas del gasto sanitario cada cinco años."
    ],
    "correct": 2
  },
  {
    "question": "En el marco del Pacto Vasco de Salud, dentro de los principios rectores, la \"Orientación al Valor\" significa que el sistema debe priorizar: (221)",
    "options": [
      "a) Las intervenciones que generen los mejores resultados relevantes para la persona al menor coste posible.",
      "b) El valor de mercado de las acciones de las empresas proveedoras de tecnología.",
      "c) El incremento constante de las infraestructuras físicas sobre la inversión en personal.",
      "d) La compra masiva de medicamentos de marca sobre los genéricos."
    ],
    "correct": 0
  },
  {
    "question": "¿En qué grandes ámbitos se estructuran las Líneas Estratégicas del Pacto Vasco de Salud? (222)",
    "options": [
      "a) Cinco Líneas Estratégicas: prevención y promoción de la salud; atención a la enfermedad; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y Gobernanza.",
      "b) Seis Líneas Estratégicas: prevención y promoción de la salud; atención a la enfermedad; áreas prioritarias de salud; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y transparencia y participación ciudadana.",
      "c) Seis Líneas Estratégicas: prevención y promoción de la salud; atención a la enfermedad; áreas prioritarias de salud; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y gobernanza.",
      "d) Seis Líneas Estratégicas: prevención y promoción de la salud; atención sociosanitaria; áreas prioritarias de salud; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y gobernanza."

    "correct": 2
  },
  {
    "question": "La Línea Estratégica I del Pacto Vasco de Salud, centrada en el enfoque \"One Health\" (Una Sola Salud), propone: (223)",

    ],
    "correct": 3
  },
  {
    "question": "¿Cuál es el papel de la Atención Primaria y Comunitaria dentro de las Líneas Estratégicas del Pacto Vasco de Salud? (224)",
    "options": [

    "correct": 3
  },
  {
    "question": "En relación con la Línea Estratégica 06 sobre \"Cronicidad\" del Pacto Vasco de Salud, ¿qué objetivo se persigue primordialmente? (225)",
    "options": [
      "a) Institucionalizar a todas las personas con enfermedades crónicas en centros especializados.",

      "c) Sustituir las consultas médicas presenciales por seguimiento telefónico automático.",
      "d) Reducir la cobertura de medicamentos para patologías de larga duración."
    ],
    "correct": 1
  },
  {
    "question": "La Línea Estratégica 07 sobre \"Atención Sociosanitaria\" del Pacto Vasco de Salud subraya la necesidad de: (226)",

    ],
    "correct": 1
  },
  {
    "question": "Respecto a la \"Salud Mental\" (Línea 11), el Pacto Vasco de Salud pone el foco en: (227)",

    "correct": 0
  },
  {
    "question": "La Línea Estratégica 18 sobre \"Digitalización en Salud\" del Pacto Vasco de Salud busca la transformación digital para: (228)",

      "d) Crear una base de datos pública con el historial clínico de toda la ciudadanía."
    ],
    "correct": 2
  },
  {
    "question": "En la \"Política de Personas\" (Línea 21) del Pacto Vasco de Salud, se establece como prioridad: (229)",
    "options": [

      "b) Fortalecer la atracción, fidelización, desarrollo y liderazgo de las y los profesionales.",
      "c) Sustituir al personal fijo por contratos temporales para ganar flexibilidad.",
      "d) Prohibir la participación de los sindicatos en la toma de decisiones estratégicas."
    ],
    "correct": 1
  },
  {
    "question": "La Línea Estratégica 24 sobre \"Derechos Lingüísticos\" del Pacto Vasco de Salud tiene como fin: (230)",
    "options": [
      "a) Garantizar que las personas pacientes puedan ser atendidas en la lengua oficial de su elección.",
      "b) Obligar a toda la ciudadanía a realizar sus consultas médicas exclusivamente en euskera.",
      "c) Eliminar el uso de lenguas extranjeras en la formación médica especializada.",
      "d) Centralizar los servicios de traducción en una única sede en Vitoria-Gasteiz."

];

            let estado = {
                preguntaActual: 0,
                totalPreguntas: preguntas.length,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0
            };

            let DOM = {};
            let botonesOpciones = [];
            let indicesPreguntas = [];

            function toggleClasses(element, addClass, removeClasses = []) {
                removeClasses.forEach(cls => element.classList.remove(cls));
                if (addClass) element.classList.add(addClass);
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.style.display = 'flex';
            }

            function ocultarModal() {
                DOM.modalOverlay.style.display = 'none';
            }

            function toggleFinalizarTest() {
                if (DOM.finalizarBtn.textContent === 'Volver al Test') {
                    DOM.contenidoPregunta.classList.remove('hidden');
                    DOM.resultadosFinales.classList.add('hidden');
                    DOM.finalizarBtn.textContent = 'Finalizar Test';
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function marcarRespuesta(preguntaIndex) {
                const pregunta = preguntas[preguntaIndex];
                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    if (index === pregunta.correct) {
                        toggleClasses(boton, 'correcta');
                    } else if (index === pregunta.respuestaUsuario) {
                        toggleClasses(boton, 'incorrecta');
                    }
                });
            }

            function mostrarPregunta() {
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];

                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                });

                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['activa']);
                    if (index === preguntaActual) toggleClasses(indice, 'activa');
                });

                if (pregunta.comprobada) {
                    marcarRespuesta(preguntaActual);
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function mostrarResultados() {
                const { respuestasCorrectas, respuestasIncorrectas } = estado;
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${respuestasCorrectas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${respuestasIncorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
                DOM.rectanguloResumen.style.marginTop = '20px';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+211}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        toggleClasses(indice, pregunta.esCorrecta ? 'correcta' : 'incorrecta');
                    }
                });
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
