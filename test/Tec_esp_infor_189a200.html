<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPE 23-24-25 Osakidetza Técnico/a Informática</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
        }
        .opciones-contenedor {
            display: grid;
            gap: 3px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">OPE 23-24-25 Osakidetza Técnico/a Informática</h1>
        <p class="subtitulo-test">Esquema Nacional de Seguridad (ENS): principios, requisitos y CCN-CERT.</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
                
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "number": 189,
    "question": "¿Cuál es el objeto principal del Esquema Nacional de Seguridad (ENS)?",
    "options": [
      "a) Regular exclusivamente la protección de datos de carácter personal en el sector público.",
      "b) Establecer los principios básicos y requisitos mínimos para una protección adecuada de la información tratada y los servicios prestados.",
      "c) Sustituir la Ley de Procedimiento Administrativo Común en materia de administración digital.",
      "d) Definir los estándares técnicos de interoperabilidad entre administraciones europeas."
    ],
    "correct": 1
  },
  {
    "number": 190,
    "question": "¿A qué entidades del sector privado les es de aplicación el cumplimiento del Esquema Nacional de Seguridad (ENS)?",
    "options": [
      "a) A todas las entidades tecnológicas que operen en territorio español.",
      "b) Únicamente a aquellas entidades que traten datos de nivel alto según el RGPD.",
      "c) A las que presten servicios a entidades del sector público para el ejercicio de sus competencias y potestades administrativas.",
      "d) A NINGUNA entidad del sector privado, ya que el ENS solo vincula a la Administración Pública."
    ],
    "correct": 2
  },
  {
    "number": 191,
    "question": "Indica cuál de los siguientes NO es un principio básico del Esquema de Seguridad Nacional:",
    "options": [
      "a) Seguridad integral.",
      "b) Gestión de la seguridad basada en los riesgos.",
      "c) Externalización obligatoria de servicios de auditoría.",
      "d) Vigilancia continua y reevaluación periódica."
    ],
    "correct": 2
  },
  {
    "number": 192,
    "question": "¿Qué contenido mínimo debe incluir el instrumento que apruebe la política de seguridad en el Esquema de Seguridad Nacional?",
    "options": [
      "a) Los roles o funciones de seguridad y la definición de sus deberes y responsabilidades.",
      "b) El inventario completo de todos los activos de hardware de la organización.",
      "c) El presupuesto detallado anual para ciberseguridad.",
      "d) La lista nominativa de todas las personas usuarias con acceso a datos de la organización."
    ],
    "correct": 0
  },
  {
    "number": 193,
    "question": "En el Esquema de Seguridad Nacional, ¿qué implica el requisito mínimo de \"Mínimo privilegio\"?",
    "options": [
      "a) Que las funciones de operación, administración y registro de actividad serán las de por defecto, sin restricciones de horario ni puntos de acceso facultados.",
      "b) Reducir el número de administradores del sistema a uno solo por cada departamento.",
      "c) Que solo el personal con rango de directivo puede acceder a la configuración del sistema.",
      "d) Que los sistemas proporcionen la funcionalidad imprescindible para alcanzar los objetivos de la organización."
    ],
    "correct": 3
  },
  {
    "number": 194,
    "question": "Para dar cumplimiento a los requisitos mínimos establecidos en el Esquema de Seguridad Nacional, las entidades comprendidas en su ámbito de aplicación adoptarán las medidas y refuerzos de seguridad correspondientes. ¿En qué documento se debe formalizar la relación de medidas de seguridad seleccionadas para un sistema?",
    "options": [
      "a) En el Informe Nacional del Estado de la Seguridad (INES).",
      "b) En el Manual de Personas Usuarias del sistema de información.",
      "c) En el pliego de prescripciones técnicas del contrato.",
      "d) En la Declaración de Aplicabilidad."
    ],
    "correct": 3
  },
  {
    "number": 195,
    "question": "En el Esquema de Seguridad Nacional, ¿con qué periodicidad mínima debe realizarse una auditoría regular ordinaria de seguridad?",
    "options": [
      "a) Al menos cada dos años.",
      "b) Anualmente.",
      "c) Cada cuatro años, coincidiendo con la renovación de cargos.",
      "d) Solo cuando se detecte un incidente de seguridad grave."
    ],
    "correct": 0
  },
  {
    "number": 196,
    "question": "Los sistemas de información competentes serán objeto de un proceso para determinar su conformidad con el Esquema de Seguridad Nacional. En este ámbito, ¿qué requiere un sistema de categoría básica?",
    "options": [
      "a) Un informe favorable emitido directamente por el Centro Criptológico Nacional.",
      "b) Únicamente una autoevaluación para su declaración de conformidad.",
      "c) Una auditoría de certificación obligatoria por una entidad acreditada.",
      "d) No requiere NINGÚN procedimiento de determinación de conformidad."
    ],
    "correct": 1
  },
  {
    "number": 197,
    "question": "En el Esquema de Seguridad Nacional, ¿quién es el órgano competente para validar y publicar los \"perfiles de cumplimiento específicos\"?",
    "options": [
      "a) La Agencia Española de Protección de Datos (AEPD).",
      "b) El Centro Criptológico Nacional (CCN).",
      "c) El Ministerio de Hacienda y Función Pública.",
      "d) La Secretaría de Estado de Digitalización e Inteligencia Artificial."
    ],
    "correct": 1
  },
  {
    "number": 198,
    "question": "En el Esquema de Seguridad Nacional a fin de determinar el impacto que tendría sobre la organización un incidente que afectara a la seguridad de la información, ¿qué dimensiones de la seguridad se tendrán en cuenta?",
    "options": [
      "a) Solo la confidencialidad y la disponibilidad.",
      "b) Costo de reposición, tiempo de recuperación, hardware afectado y software afectado.",
      "c) Disponibilidad, autenticidad, integridad, confidencialidad y trazabilidad.",
      "d) Solo costo de reposición y tiempo de recuperación."
    ],
    "correct": 2
  },
  {
    "number": 199,
    "question": "Según el Esquema de Seguridad Nacional, ¿cuáles son los grupos en los que se estructuran las medidas de seguridad?",
    "options": [
      "a) Marco organizativo, Marco operacional y Medidas de protección.",
      "b) Físicas, Lógicas y Organizativas.",
      "c) Prevención, Detección y Respuesta.",
      "d) Básicas, Medias y Altas."
    ],
    "correct": 0
  },
  {
    "number": 200,
    "question": "Según el Esquema de Seguridad Nacional, ¿qué facultad tiene el CCN-CERT para el cumplimiento de sus funciones de soporte y coordinación en la resolución de incidentes?",
    "options": [
      "a) Puede sancionar económicamente a las entidades que no hayan aplicado las medidas de seguridad preventivas.",
      "b) Tiene la potestad de sustituir al personal técnico de la entidad afectada hasta que el incidente esté resuelto.",
      "c) Puede recabar informes, registros de auditoría, configuraciones de los sistemas afectados y cualquier otra información o soporte necesario para la investigación.",
      "d) Todas las anteriores son correctas."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[preguntaActual];
                const cleanedQuestion = pregunta.question.replace(/^\s*(\d+\.\s*)+/, '');
                DOM.preguntaTexto.textContent = `${pregunta.number}. ${cleanedQuestion}`;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                    }
                }
            }

            function comprobarRespuesta() {
                const respuestaSeleccionadaActual = DOM.opcionesContenedor.querySelector('.opcion.seleccionada');
                if (!respuestaSeleccionadaActual) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }
                const { preguntaActual } = estado;
                const pregunta = preguntas[preguntaActual];
                const respuestaIndex = parseInt(respuestaSeleccionadaActual.dataset.index);

                pregunta.respuestaUsuario = respuestaIndex;
                pregunta.comprobada = true;
                pregunta.esCorrecta = (respuestaIndex === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const { preguntaActual, totalPreguntas } = estado;
                const esUltimaPregunta = preguntaActual === totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                const { preguntaActual, totalPreguntas } = estado;
                if (preguntaActual < totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function volverPregunta() {
                const { preguntaActual } = estado;
                if (preguntaActual > 0) {
                    estado.preguntaActual--;
                    mostrarPregunta();
                }
            }

            function mostrarResultados() {
                const { respuestasCorrectas, respuestasIncorrectas } = estado;
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${respuestasCorrectas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${respuestasIncorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
                DOM.rectanguloResumen.style.marginTop = '20px';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${preguntas[i].number}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }
            

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'volver-btn') {
                        volverPregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
                
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
